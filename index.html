  <body>

        <svg width="48" height="48" viewBox="0 0 48 48" style="animation:crx-spin 1s linear infinite">
          <circle cx="24" cy="24" r="20" fill="none" stroke="#28A26A" stroke-width="4" stroke-dasharray="80 40" stroke-linecap="round"/>
        </svg>
        <p style="margin-top:16px;color:#28A26A;font-size:14px;font-weight:500">Loading Crop RX...</p>
        <style>@keyframes crx-spin{to{transform:rotate(360deg)}}</style>
