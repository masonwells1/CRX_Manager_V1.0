<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Green background -->
  <rect width="512" height="512" rx="90" fill="#28A26A"/>

  <!-- CROP RX big and centered - max size that fits -->
  <text x="256" y="185" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="100" fill="white">CROP RX</text>

  <!-- SOLUTIONS centered below -->
  <text x="256" y="255" text-anchor="middle" font-family="'Arial', 'Helvetica', sans-serif" font-weight="600" font-size="48" fill="rgba(255,255,255,0.75)" letter-spacing="12">SOLUTIONS</text>

  <!-- Dark grey banner for MANAGER - lower and bigger -->
  <rect x="36" y="295" width="440" height="100" rx="16" fill="#2E2E2E"/>

  <!-- MANAGER text centered on banner - bigger -->
  <text x="256" y="365" text-anchor="middle" font-family="'Arial Narrow', 'Barlow Semi Condensed', sans-serif" font-weight="700" font-size="78" fill="white" letter-spacing="6">MANAGER</text>
</svg>
