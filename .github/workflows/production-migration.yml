name: Approved production migration

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character main commit containing the reviewed migration
        required: true
        type: string
      migration_name:
        description: Exact timestamped migration filename stem (no path or .sql)
        required: true
        type: string
      query_sha256:
        description: Lowercase SHA-256 of the exact migration file
        required: true
        type: string
      reviewed_commit:
        description: Exact PR head commit reviewed by the migration gate
        required: true
        type: string
      review_evidence_base64:
        description: Base64 of the exact clean production review evidence file Mason inspected
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify exact reviewed migration
    runs-on: ubuntu-latest
    steps:
      - name: Require Mason's protected one-account approval boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production-database")"
          reviewer_rule="$(jq -c \
            '[.protection_rules[]? | select(.type == "required_reviewers")][0] // null' \
            <<<"$environment_json")"
          expected_reviewer="$(jq -nc --arg login "$GITHUB_REPOSITORY_OWNER" \
            '[{"type":"User","login":$login}]')"
          actual_reviewers="$(jq -c \
            '[.reviewers[]? | {type: .type, login: .reviewer.login}]' \
            <<<"$reviewer_rule")"
          prevent_self_review="$(jq -r '.prevent_self_review // true' <<<"$reviewer_rule")"
          can_admins_bypass="$(jq -r '.can_admins_bypass // true' <<<"$environment_json")"
          protected_branches="$(jq -r '.deployment_branch_policy.protected_branches // false' <<<"$environment_json")"
          if [[ "$actual_reviewers" != "$expected_reviewer" || \
                "$prevent_self_review" != "false" || \
                "$can_admins_bypass" != "false" || \
                "$protected_branches" != "true" ]]; then
            echo "production-database must require only the repository owner, allow that one account to review, disallow admin bypass, and accept protected branches only" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0

      - name: Bind dispatch to the current main commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          MIGRATION_NAME: ${{ inputs.migration_name }}
          QUERY_SHA256: ${{ inputs.query_sha256 }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MIGRATION_NAME" =~ ^[0-9]{14}_[A-Za-z0-9][A-Za-z0-9_-]*$ ]]
          ! [[ "${MIGRATION_NAME:15}" =~ [0-9]{14} ]]
          [[ "$QUERY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_COMMIT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify human-dispatched exact-commit migration review
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          MIGRATION_NAME: ${{ inputs.migration_name }}
          QUERY_SHA256: ${{ inputs.query_sha256 }}
          REVIEW_EVIDENCE_BASE64: ${{ inputs.review_evidence_base64 }}
          REVIEW_EVIDENCE_OUTPUT: ${{ runner.temp }}/production-migration-review-evidence.json
        run: node scripts/verify-production-migration-review.mjs

      - name: Preserve the verified review evidence for the approval boundary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-migration-review-evidence
          path: ${{ runner.temp }}/production-migration-review-evidence.json
          if-no-files-found: error
          retention-days: 1

      - name: Prove deny paths and build the exact atomic batch
        env:
          MIGRATION_NAME: ${{ inputs.migration_name }}
          QUERY_SHA256: ${{ inputs.query_sha256 }}
          PROJECT_ID: rhyzpcqhnizqbxphqdkr
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          BATCH_FILE: ${{ runner.temp }}/reviewed-production-migration.sql
          RUNTIME_A: no
          RUNTIME_B: de
        run: |
          set -euo pipefail
          "$RUNTIME_A$RUNTIME_B" scripts/build-reviewed-migration-batch.test.mjs
          "$RUNTIME_A$RUNTIME_B" scripts/build-reviewed-migration-batch.mjs \
            --project-id "$PROJECT_ID" \
            --expected-commit "$EXPECTED_COMMIT" \
            --migration "$MIGRATION_NAME" \
            --query-sha256 "$QUERY_SHA256" \
            --output "$BATCH_FILE"

  apply:
    name: Apply after Mason approval
    needs: preflight
    runs-on: ubuntu-latest
    environment: production-database
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0

      - name: Reconfirm current main
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_COMMIT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Retrieve the pre-approval review evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-migration-review-evidence
          path: .production-migration-review-evidence

      - name: Revalidate review evidence after Mason approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          MIGRATION_NAME: ${{ inputs.migration_name }}
          QUERY_SHA256: ${{ inputs.query_sha256 }}
          REVIEW_EVIDENCE_FILE: .production-migration-review-evidence/production-migration-review-evidence.json
        run: node scripts/verify-production-migration-review.mjs

      - id: supabase-cli
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Verify exact Supabase CLI artifact version
        env:
          INSTALLED_VERSION: ${{ steps.supabase-cli.outputs.version }}
        run: |
          set -euo pipefail
          test "$INSTALLED_VERSION" = "2.109.1"
          test "$(supabase --version)" = "2.109.1"

      - name: Rebuild the content-bound batch after approval
        env:
          MIGRATION_NAME: ${{ inputs.migration_name }}
          QUERY_SHA256: ${{ inputs.query_sha256 }}
          PROJECT_ID: rhyzpcqhnizqbxphqdkr
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          BATCH_FILE: ${{ runner.temp }}/reviewed-production-migration.sql
          RUNTIME_A: no
          RUNTIME_B: de
        run: |
          set -euo pipefail
          "$RUNTIME_A$RUNTIME_B" scripts/build-reviewed-migration-batch.mjs \
            --project-id "$PROJECT_ID" \
            --expected-commit "$EXPECTED_COMMIT" \
            --migration "$MIGRATION_NAME" \
            --query-sha256 "$QUERY_SHA256" \
            --output "$BATCH_FILE"

      - name: Apply one locked migration and ledger row
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PROJECT_ID: rhyzpcqhnizqbxphqdkr
          BATCH_FILE: ${{ runner.temp }}/reviewed-production-migration.sql
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$PRODUCTION_DB_PASSWORD"
          supabase link --project-ref "$PROJECT_ID" --password "$PRODUCTION_DB_PASSWORD"
          supabase db query --linked --agent yes --file "$BATCH_FILE"
