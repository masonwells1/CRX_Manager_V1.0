name: Production approval boundary canary

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  preflight:
    name: Verify protected environment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require Mason's protected one-account approval boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production-database")"
          reviewer_rule="$(jq -c \
            '[.protection_rules[]? | select(.type == "required_reviewers")][0] // null' \
            <<<"$environment_json")"
          expected_reviewer="$(jq -nc --arg login "$GITHUB_REPOSITORY_OWNER" \
            '[{"type":"User","login":$login}]')"
          actual_reviewers="$(jq -c \
            '[.reviewers[]? | {type: .type, login: .reviewer.login}]' \
            <<<"$reviewer_rule")"
          prevent_self_review="$(jq -r '.prevent_self_review // true' <<<"$reviewer_rule")"
          can_admins_bypass="$(jq -r '.can_admins_bypass // true' <<<"$environment_json")"
          protected_branches="$(jq -r '.deployment_branch_policy.protected_branches // false' <<<"$environment_json")"
          if [[ "$actual_reviewers" != "$expected_reviewer" || \
                "$prevent_self_review" != "false" || \
                "$can_admins_bypass" != "false" || \
                "$protected_branches" != "true" ]]; then
            echo "production-database protection is incomplete" >&2
            exit 1
          fi

  approval:
    name: Harmless approval capability test
    needs: preflight
    runs-on: ubuntu-latest
    environment: production-database
    permissions:
      contents: read
    steps:
      - name: Confirm the approved canary changed nothing
        run: echo "Production approval boundary canary passed; no production system was contacted."
