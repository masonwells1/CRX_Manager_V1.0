name: Production approval boundary canary

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  preflight:
    name: Verify protected environment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Require Mason's protected one-account approval boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/assert-production-environment-protection.mjs

  approval:
    name: Harmless approval capability test
    needs: preflight
    runs-on: ubuntu-latest
    environment: production-database
    permissions:
      contents: read
    steps:
      - name: Confirm the approved canary changed nothing
        run: echo "Production approval boundary canary passed; no production system was contacted."
