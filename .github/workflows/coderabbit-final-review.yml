name: CodeRabbit final review gate

on:
  pull_request_target:
    types: [labeled, synchronize, reopened, converted_to_draft]

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: coderabbit-final-review-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  final-review-gate:
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'ready-for-coderabbit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target is privileged. Checkout the trusted default branch
      # only; never fetch or execute the pull request's code in this workflow.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reset or request the one-shot final review
        uses: actions/github-script@v8
        with:
          script: |
            const gate = require('./.github/scripts/coderabbit-final-review.cjs');
            await gate.run({
              github,
              context,
              core,
              config: {
                quietPeriodMs: 30_000,
                requiredChecks: [
                  'Lint, Type Check, Test, Build',
                  'SQL Migration Validation',
                  'Vercel',
                ],
                ignoredChecks: ['CodeRabbit'],
              },
            });
