name: CodeRabbit final review gate

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, closed, reopened, converted_to_draft, ready_for_review, auto_merge_enabled, auto_merge_disabled, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  # Required by actions.getWorkflowRun to bind required checks to their trusted workflow.
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: coderabbit-final-review-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  # Let an in-flight run finish its post-comment stale-head cleanup before a
  # queued synchronize reset removes the workflow labels.
  cancel-in-progress: false

jobs:
  final-review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target is privileged. Checkout the trusted default branch
      # only; never fetch or execute the pull request's code in this workflow.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Detect the trusted default-branch gate implementation
        id: trusted-gate
        shell: bash
        env:
          BOOTSTRAP_PR_NUMBER: ${{ github.event.pull_request.number }}
          BOOTSTRAP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -f .github/scripts/coderabbit-final-review.cjs ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$BOOTSTRAP_PR_NUMBER" == "516" && "$BOOTSTRAP_BASE_SHA" == "9c9d6d96ec3586eada89e6ab7fd3eba71109712d" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Trusted gate script is absent only for the immutable PR #516 bootstrap; event is a no-op."
          else
            echo "::error::Trusted default-branch gate script is missing outside the authorized bootstrap identity."
            exit 1
          fi
      - name: Reset, request, or validate the one-shot final review
        if: steps.trusted-gate.outputs.available == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const gate = require('./.github/scripts/coderabbit-final-review.cjs');
            await gate.run({
              github,
              context,
              core,
              config: {
                quietPeriodMs: 30_000,
                requiredChecks: [
                  {
                    name: 'Lint, Type Check, Test, Build',
                    source: 'check_run',
                    appId: 15368,
                    workflowId: 237414414,
                    workflowPath: '.github/workflows/ci.yml',
                  },
                  {
                    name: 'SQL Migration Validation',
                    source: 'check_run',
                    appId: 15368,
                    workflowId: 237414414,
                    workflowPath: '.github/workflows/ci.yml',
                  },
                  {
                    name: 'Vercel',
                    source: 'status',
                    creator: 'vercel[bot]',
                  },
                ],
                ignoredChecks: ['CodeRabbit'],
              },
            });
