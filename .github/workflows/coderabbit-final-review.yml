name: CodeRabbit final review gate

# `pull_request_target` ONLY. Do NOT add `pull_request_review` (or any other
# pull-request event) back to this workflow.
#
# This job holds `issues: write`, and it is allowed to hold it because
# `pull_request_target` selects the workflow YAML from the DEFAULT BRANCH — the
# pull request cannot supply the steps that run. `pull_request_review` does not
# behave that way: it selects the YAML from the PULL REQUEST's own ref, so a PR
# that edits this file would execute its own version of these steps with this
# job's write token. Checking out the default branch below does not help, because
# the step doing the checkout would itself come from the PR.
#
# Proven on this PR, not theorised: while this file did not exist on `main` at
# all, a `pull_request_review` event still produced a successful run of it —
# event=pull_request_review, head_sha=8ddcd9aee…, head_branch=codex/coderabbit-
# ready-label-20260830. A file absent from `main` can only have come from the PR.
# Two tests pin this: `no pull-request event other than pull_request_target
# triggers this privileged workflow` (parses this `on:` block) and `the gate
# refuses to run on any event other than pull_request_target` (drives run()).
on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, closed, reopened, converted_to_draft, ready_for_review, auto_merge_enabled, auto_merge_disabled, edited]

permissions:
  # Required by actions.getWorkflowRun to bind required checks to their trusted workflow.
  actions: read
  checks: read
  contents: read
  issues: write
  # Labels and comments on a PULL REQUEST are authorized against the
  # pull-requests scope, not the issues scope, even though the REST routes this
  # gate calls live under /issues. `issues: write` alone is NOT enough, and an
  # explicit `pull-requests: read` actively pins the scope this gate needs at
  # read. Every reset event — synchronize, reopen, draft conversion, base edit,
  # auto-merge change — calls issues.removeLabel for both workflow labels, so
  # every push to any open pull request produced "Resource not accessible by
  # integration": the gate failed before it could do anything, AND before it
  # could clear its own labels. The label-cleanup line in those logs is the
  # symptom; this scope is the cause. Observed red on every open pull request
  # from 2026-09-02 21:48Z (run 33696854203 among many); the rare green run was
  # an event that never touched a label.
  #
  # Safe on this privileged pull_request_target workflow for the same reason
  # `issues: write` already is: the job checks out ONLY the default branch with
  # persist-credentials:false and never fetches or executes the pull request's
  # code, so no untrusted code ever holds this token.
  #
  # `issues: write` is kept. It is believed redundant here — every object this
  # gate touches is a pull request — but removing it is a separate, unproven
  # narrowing and does not belong in the fix for the outage.
  pull-requests: write
  statuses: read

concurrency:
  group: coderabbit-final-review-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  # Let an in-flight run finish its post-comment stale-head cleanup before a
  # queued synchronize reset removes the workflow labels.
  cancel-in-progress: false

jobs:
  final-review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target is privileged. Checkout the trusted default branch
      # only; never fetch or execute the pull request's code in this workflow.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Detect the trusted default-branch gate implementation
        id: trusted-gate
        shell: bash
        env:
          BOOTSTRAP_PR_NUMBER: ${{ github.event.pull_request.number }}
          BOOTSTRAP_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BOOTSTRAP_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The bootstrap identity must NOT be pinned to a base SHA. `main`
          # requires a pull request to be up to date before it can merge, so the
          # base SHA changes every time `main` moves — pinning it made this
          # introducing PR unmergeable by construction, which is how the pin was
          # found. PR number, head ref and base ref are all stable for the life
          # of this pull request.
          #
          # This arm is unreachable after the merge: the script is then present
          # on the default branch and the first test wins. Its failure mode is a
          # no-op — no review requested — never a privilege gain.
          if [[ -f .github/scripts/coderabbit-final-review.cjs ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$BOOTSTRAP_PR_NUMBER" == "516" \
                  && "$BOOTSTRAP_HEAD_REF" == "codex/coderabbit-ready-label-20260830" \
                  && "$BOOTSTRAP_BASE_REF" == "main" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Trusted gate script is absent only for the PR #516 bootstrap; event is a no-op."
          else
            echo "::error::Trusted default-branch gate script is missing outside the authorized bootstrap identity."
            exit 1
          fi
      - name: Reset, request, or validate the one-shot final review
        if: steps.trusted-gate.outputs.available == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const gate = require('./.github/scripts/coderabbit-final-review.cjs');
            await gate.run({
              github,
              context,
              core,
              config: {
                quietPeriodMs: 30_000,
                requiredChecks: [
                  {
                    name: 'Lint, Type Check, Test, Build',
                    source: 'check_run',
                    appId: 15368,
                    workflowId: 237414414,
                    workflowPath: '.github/workflows/ci.yml',
                  },
                  {
                    name: 'SQL Migration Validation',
                    source: 'check_run',
                    appId: 15368,
                    workflowId: 237414414,
                    workflowPath: '.github/workflows/ci.yml',
                  },
                  {
                    name: 'Vercel',
                    source: 'status',
                    creator: 'vercel[bot]',
                  },
                ],
                ignoredChecks: [
                  {
                    name: 'CodeRabbit',
                    source: 'status',
                    creator: 'coderabbitai[bot]',
                  },
                ],
              },
            });
