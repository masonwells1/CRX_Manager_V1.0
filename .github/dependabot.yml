version: 2
updates:
  # npm dependencies — weekly, Mondays 06:00.
  # Minor + patch version bumps are grouped into ONE PR; majors fall outside
  # the group and arrive as separate PRs. Security updates are not affected
  # by this schedule — Dependabot raises those on its own default cadence.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # These majors require coordinated framework/toolchain migrations. Opening
    # one-package PRs creates known peer-dependency or compiler failures.
    # Security updates remain eligible because only version-update majors are
    # ignored here.
    ignore:
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions workflow dependencies — same weekly cadence.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
