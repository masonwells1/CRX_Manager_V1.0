# CodeRabbit configuration for CRX Manager
# Docs: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

# "chill" = fewer style nitpicks, focus on real problems. Mason is a solo,
# non-coder owner running a live money app; signal matters more than volume.
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Report sections (sequence diagrams, related PRs/issues, linked-issue
  # assessment, suggested labels/reviewers, changed-files summary) are left at
  # their defaults - ON. Mason's call, 2026-08-20: he raised the usage spending
  # cap rather than trade any possible review context for a cheaper report.
  # Deliberate: do not turn these off to save spend.

  # Skip churn that cannot contain a bug: archived/audit/loop/handoff
  # artifacts (340+ files), the generated Codex adapters under .agents/ and
  # .codex/ (regenerated by scripts/sync-agent-workflows.mjs, guarded by
  # scripts/agent-manifest-parity.mjs), and lock files. A PR touching only
  # these is skipped entirely and costs no review allowance. Live docs
  # (docs/manual, docs/reference, docs/workflows, docs/plans) stay reviewed.
  #
  # Lock files are deliberately NOT excluded. Excluding them means a PR that
  # changes only package-lock.json drops to zero reviewable files and is
  # skipped outright, so nothing inspects the version bumps or integrity
  # hashes - a dependency-supply-chain blind spot. Raised by the Codex
  # reviewer on FarmRx PR #26, 2026-08-20.
  path_filters:
    - "!docs/archive/**"
    - "!docs/audits/**"
    - "!docs/loops/**"
    - "!docs/build-loops/**"
    - "!docs/handoffs/**"
    - "!.agents/**"
    - "!.codex/**"

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    # Pause AUTOMATIC review after 2 reviewed commits on a PR (this applies to
    # ordinary non-draft PRs, not just drafts). Later pushes are then not
    # auto-reviewed until someone comments `@coderabbitai review`, which
    # resumes it. The default of 5 spent the weekly allowance on half-finished
    # commits and left nothing for the finished code: PR #429 (21 commits) and
    # PR #434 both hit "Review limit reached".
    #
    # This number is NOT the pre-merge gate and must never be treated as one.
    # The gate is the required fresh `@coderabbitai review` on the FINAL
    # commit, enforced by .claude/skills/deploy-check/SKILL.md.
    auto_pause_after_reviewed_commits: 2

  # Project-specific review guidance. These mirror the "CRX Hard Rules" in
  # AGENTS.md so CodeRabbit flags the exact mistakes that have bitten this
  # codebase before, not just generic style.
  path_instructions:
    - path: "supabase/migrations/**"
      instructions: >-
        This is a Supabase (PostgreSQL) migration for a live production app.
        Flag as high severity: any new table that does NOT enable Row Level
        Security (RLS) with policies in the same file; any SECURITY DEFINER
        function missing `SET search_path = public, pg_temp`; any mutating RPC
        that does not accept and enforce `p_idempotency_key text DEFAULT NULL`;
        any GRANT EXECUTE to anon/public on a function that writes data; any
        edit to an already-applied migration (migrations must be new files
        only). Money must be exact whole cents - never floating point. New
        money storage uses bigint cents; any new or changed money column must
        carry a finite whole-cent CHECK constraint named
        `<table>_<column>_whole_cents_chk`. A CHECK constraint that changes
        allowed status values must include all previously allowed values.
        Timestamps on the live database are UTC: flag any business-day,
        cutoff, or period-boundary logic that does not convert explicitly to
        America/Chicago.
    - path: "src/**"
      instructions: >-
        React 18 + TypeScript frontend for a live app. Flag: money handled as
        floating-point instead of integer cents; money math that does
        arithmetic on decimal strings or floats instead of parsing operands
        into integer cents FIRST; missing `assertRpcResult()` after an RPC call
        or `checkMutationResult()` after `.update()` / `.delete()`; use of
        `confirm()`, `window.confirm()`, or `alert()` instead of the shared
        ConfirmModal / toast components; writes to generated columns such as
        `invoices.balance_cents`; Supabase clients created anywhere other than
        `src/lib/db.ts`; Sentry imported from anywhere other than
        `src/lib/sentry`; any hardcoded secret, API key, or service_role key in
        frontend code. Timestamps from the database are UTC - flag business-day
        or period logic that does not convert explicitly to America/Chicago.
    - path: "src/**/*[Bb]lend*"
      instructions: >-
        Blend tickets are a MONEY path, not just an agronomy form: billing is
        driven by `rate_per_acre`, and a blank or missing unit still bills.
        Review any change here with the same severity as invoice or payment
        code. Flag unit handling that can silently mix measures (for example
        adding gallons to pounds), a missing or unvalidated unit that still
        reaches a billed amount, and any rate/quantity math that is not exact
        integer-cent arithmetic.
    - path: "supabase/functions/**"
      instructions: >-
        Supabase Edge Functions. Flag missing or inconsistent CORS handling,
        and any secret/service-role key that is logged or returned to the
        client.

# Teach CodeRabbit this repo's own written rules so it reviews against the
# actual house standard instead of only the path instructions above.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/reference/gotchas.md"
      - "docs/workflows/**.md"

chat:
  auto_reply: true
