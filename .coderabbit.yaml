# CodeRabbit configuration for CRX Manager
# Docs: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

# "chill" = fewer style nitpicks, focus on real problems. Mason is a solo,
# non-coder owner running a live money app; signal matters more than volume.
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Report sections (sequence diagrams, related PRs/issues, linked-issue
  # assessment, suggested labels/reviewers, changed-files summary) are left at
  # their defaults - ON. Mason's call, 2026-08-20: he raised the usage spending
  # cap rather than trade any possible review context for a cheaper report.
  # Deliberate: do not turn these off to save spend.

  # path_filters opened as a cost-control lever covering archived/audit/loop/
  # handoff artifacts (340+ files). Four review rounds took it apart; the
  # history is recorded below because each narrowing failed for the same reason
  # and the next person will be tempted to re-add one of them. What is left is
  # the generated Codex adapters under .agents/ and nothing else. Every
  # document under docs/ is reviewed.
  #
  # This costs less review allowance than it looks like: the throttling this
  # config was written to fix came from auto_pause_after_reviewed_commits, not
  # from path filters. Mason's standing call is quality over spend.
  #
  # .codex/ is NOT excluded. Only .agents/ is generated - that is the sole
  # TARGET_ROOT in scripts/sync-agent-workflows.mjs. Every tracked file under
  # .codex/ is hand-maintained, including production-action-guard.mjs (which
  # gates live mutations, pushes, and merges), hooks.json, and config.toml.
  # Excluding them would let a PR that only weakens that guard skip review
  # entirely. Raised by the Codex reviewer on PR #441, 2026-08-20.
  #
  # DO NOT add a positive (non-`!`) pattern here without re-testing. Both
  # CodeRabbit and the Codex reviewer recommended adding `**/package-lock.json`
  # to override CodeRabbit's default lockfile ignore. Applied literally on
  # FarmRx PR #26 (2026-08-20) that advice returned "No files to review": once
  # ANY positive pattern exists, only files matching a positive pattern are
  # reviewed, so the one changed file - .coderabbit.yaml itself - was dropped.
  # A single well-meant line silently switched off review for the whole repo.
  # Exclusion-only filters are therefore the safe form here.
  #
  # Known, accepted gap: a PR changing ONLY package-lock.json is skipped by
  # CodeRabbit's own default ignore list, so version bumps and integrity hashes
  # go uninspected. That predates this config and is NOT closed here. Closing
  # it needs a verified include form, tested on FarmRx first, never on CRX.
  # Every exclusion below is scoped to documentation/data EXTENSIONS, never a
  # blanket directory. A blanket `!docs/audits/**` also hid executable code:
  # docs/audits/ordering-cycle-review-2026-08-09/workflow.mjs and
  # build-report.mjs are real programs, and a PR changing only those would have
  # skipped review entirely. Raised by the Codex reviewer on PR #441.
  # Keep this shape - if a new folder is excluded, exclude its doc extensions,
  # not the folder, so a script dropped in there stays reviewable by default.
  #
  # Extension-scoping is still not enough on its own. docs/audits/ mixes two
  # very different things: inert dated reports, and LIVE AGENT CONTROL FILES -
  # architecture-weakness-audit-prompt.md and foundation-ultra-review-prompt.md
  # are the canonical instructions their slash commands say to "read that file
  # and execute it exactly", and codex-driven-bug-hunt/LEDGER.json plus
  # PHASE-PLAN.md are state that automation reads and writes. Excluding all
  # .md/.json under docs/audits/ meant a PR could rewrite a privileged agent
  # prompt next to one innocuous reviewed file and still collect an exact-head
  # CodeRabbit stamp - the review would never have looked at it. On a PUBLIC
  # repo that is a prompt-injection path into privileged automation, not a
  # cost-control question. Raised by the Codex reviewer on PR #441 (CRX-SEC-001,
  # High). That round narrowed the exclusion to date-prefixed reports only; the
  # round recorded further down removed even that, so docs/audits/ is reviewed
  # in full today.
  #
  # Then the SAME defect turned up in the directories that fix did not touch:
  # docs/loops/, docs/build-loops/, and docs/handoffs/ were excluded and are
  # also live agent control surfaces. `.claude/commands/run-loop.md` says its
  # job is "read docs/loops/Y.md and execute it"; docs/build-loops/*/ holds
  # LOOP_PROMPT.md, BUILD-LOOP.md and STATE.md that drive autonomous work
  # through migration, merge, and production gates; a handoff doc is by
  # definition instructions for the next session. All three exclusions are
  # GONE. Raised by the Codex reviewer on PR #441 after the docs/audits fix
  # shipped - fixing one instance of a class and stopping is how the second
  # instance survives. docs/archive/ is the only genuinely inert tree left,
  # and scripts/coderabbit-review-coverage.test.mjs now enforces that every
  # agent-consumed control root stays reviewable, not just docs/audits/.
  #
  # And the date-prefix carve-out went too. "Dated file = inert report" is a
  # guess about content from the SHAPE OF A FILENAME, and it was wrong: of the
  # 57 matches, 23 are prompts, handoffs, ledgers, plans, or go-live execution
  # docs, and one of them is cited by the codex-review skill as a worked
  # example. A future control prompt could be created with that name shape and
  # would drop out of review silently. docs/audits/ is now reviewed in full.
  # Raised by the Codex reviewer on PR #441, third round on this same theme:
  # `!docs/audits/**` hid executable code, extension-scoping hid live prompts,
  # and the date prefix hid the rest. If a document really is inert, the way to
  # retire it is to MOVE it into docs/archive/ after looking at it - a decision
  # someone makes about a specific file, not a pattern that guesses.
  #
  # And then docs/archive/ went too, for the same reason one notch deeper.
  # "Archive" is a naming convention, not a property. Nothing in the repo makes
  # those files immutable, and automation DOES read them:
  # .claude/agents/rls-security-reviewer.md tells a security-reviewing agent to
  # consult docs/archive/2026-spring/2026-05-26-claude-disposition-of-codex-
  # execution.md for the incident patterns it hunts, and docs/reference/
  # migration-history.md cites archived execution summaries for migration
  # context. An excluded file that a reviewer agent reads is the same
  # prompt-injection path as an excluded prompt. Raised by the Codex reviewer on
  # PR #441 - the fourth round on this theme, and the one that caught the
  # exclusion the previous three rounds had been narrowing TOWARD.
  #
  # .agents/ is the only remaining exclusion, and it is inert by CONSTRUCTION
  # rather than by convention: it is generated output, the sole TARGET_ROOT of
  # scripts/sync-agent-workflows.mjs, and scripts/check-agent-workflows.mjs
  # fails the test suite if any adapter drifts from its .claude/ source. A
  # hand-edit there cannot ship unreviewed - it turns CI red. That enforcing
  # check is what earns the exclusion; a directory name never does.
  #
  # The bar for anything added here: name the mechanism that makes the files
  # inert, and point at the check that fails if they stop being inert.
  # scripts/coderabbit-review-coverage.test.mjs enforces both halves - every
  # filter must be exclusion-only, and no excluded path may be referenced by any
  # live agent or automation surface.
  path_filters:
    - "!.agents/**"

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    # Pause AUTOMATIC review after 2 reviewed commits on a PR (this applies to
    # ordinary non-draft PRs, not just drafts). Later pushes are then not
    # auto-reviewed until someone comments `@coderabbitai review`, which
    # resumes it. The default of 5 spent the weekly allowance on half-finished
    # commits and left nothing for the finished code: PR #429 (21 commits) and
    # PR #434 both hit "Review limit reached".
    #
    # This number is NOT the pre-merge gate and must never be treated as one.
    # The gate is the required fresh `@coderabbitai review` on the FINAL
    # commit, enforced by .claude/skills/deploy-check/SKILL.md.
    auto_pause_after_reviewed_commits: 2

  # Project-specific review guidance. These mirror the "CRX Hard Rules" in
  # AGENTS.md so CodeRabbit flags the exact mistakes that have bitten this
  # codebase before, not just generic style.
  path_instructions:
    - path: "supabase/migrations/**"
      instructions: >-
        This is a Supabase (PostgreSQL) migration for a live production app.
        Flag as high severity: any new table that does NOT enable Row Level
        Security (RLS) with policies in the same file; any SECURITY DEFINER
        function missing `SET search_path = public, pg_temp`; any mutating RPC
        that does not accept and enforce `p_idempotency_key text DEFAULT NULL`;
        any GRANT EXECUTE to anon/public on a function that writes data; any
        edit to an already-applied migration (migrations must be new files
        only). Money must be exact whole cents - never floating point. New
        money storage uses bigint cents; any new or changed money column must
        carry a finite whole-cent CHECK constraint named
        `<table>_<column>_whole_cents_chk`. A CHECK constraint that changes
        allowed status values must include all previously allowed values.
        Timestamps on the live database are UTC: flag any business-day,
        cutoff, or period-boundary logic that does not convert explicitly to
        America/Chicago.
    - path: "src/**"
      instructions: >-
        React 18 + TypeScript frontend for a live app. Flag: money handled as
        floating-point instead of integer cents; money math that does
        arithmetic on decimal strings or floats instead of parsing operands
        into integer cents FIRST; missing `assertRpcResult()` after an RPC call
        or `checkMutationResult()` after `.update()` / `.delete()`; use of
        `confirm()`, `window.confirm()`, or `alert()` instead of the shared
        ConfirmModal / toast components; writes to generated columns such as
        `invoices.balance_cents`; Supabase clients created anywhere other than
        `src/lib/db.ts`; Sentry imported from anywhere other than
        `src/lib/sentry`; any hardcoded secret, API key, or service_role key in
        frontend code. Timestamps from the database are UTC - flag business-day
        or period logic that does not convert explicitly to America/Chicago.
    # Two patterns, not one: `src/**/*[Bb]lend*` matches only the FILENAME
    # component, so it catches src/pages/BlendTickets.tsx but misses
    # src/components/blendtickets/BulkTicketUpload.tsx. The directory form
    # covers everything inside a blend-named folder. Raised by the Codex
    # reviewer on PR #441 - an earlier `git ls-files` check was a misleading
    # oracle here, because git pathspec globbing is not CodeRabbit's matcher.
    - path: "src/**/[Bb]lend*/**"
      instructions: >-
        Blend tickets are a MONEY path, not just an agronomy form: billing is
        driven by `rate_per_acre`, and a blank or missing unit still bills.
        Review any change here with the same severity as invoice or payment
        code. Flag unit handling that can silently mix measures (for example
        adding gallons to pounds), a missing or unvalidated unit that still
        reaches a billed amount, and any rate/quantity math that is not exact
        integer-cent arithmetic.
    - path: "src/**/*[Bb]lend*"
      instructions: >-
        Blend tickets are a MONEY path, not just an agronomy form: billing is
        driven by `rate_per_acre`, and a blank or missing unit still bills.
        Review any change here with the same severity as invoice or payment
        code. Flag unit handling that can silently mix measures (for example
        adding gallons to pounds), a missing or unvalidated unit that still
        reaches a billed amount, and any rate/quantity math that is not exact
        integer-cent arithmetic.
    - path: "supabase/functions/**"
      instructions: >-
        Supabase Edge Functions. Flag missing or inconsistent CORS handling,
        and any secret/service-role key that is logged or returned to the
        client.

# Teach CodeRabbit this repo's own written rules so it reviews against the
# actual house standard instead of only the path instructions above.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/reference/gotchas.md"
      - "docs/workflows/**.md"

chat:
  auto_reply: true
