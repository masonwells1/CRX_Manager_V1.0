# CodeRabbit configuration for CRX Manager
# Docs: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

# "assertive" = report everything and let a later pass filter. Mason's call,
# 2026-08-24, reversing the earlier "chill" setting.
#
# Why the reversal: `chill` is not a cost control, it is an instruction to the
# reviewer to report less. That is the exact anti-pattern the Opus-5 tuning
# section of AGENTS.md forbids for review prompts - ask for every finding and
# filter afterwards, because a model told to be conservative obeys literally and
# finds less. Billing is per FILE REVIEWED (25c/file over the included limit),
# never per comment, so this buys coverage for nothing but extra reading.
reviews:
  profile: assertive

  # Makes CodeRabbit withhold approval until its comments are resolved AND - the
  # part that matters here - "the latest commit has been reviewed" (schema
  # description, verified 2026-08-24). That clause is first-party enforcement of
  # the exact-head problem this repo keeps hitting, where a review earned by an
  # earlier commit reads as a green light for the final one. It is also the
  # switch that gives the `mode: error` checks below any force at all: per
  # CodeRabbit's docs, an error-mode check only holds a PR when this is enabled.
  #
  # Scope, stated honestly: this is pressure, NOT a hard block. The protect-main
  # ruleset requires exactly three contexts - Vercel, "Lint, Type Check, Test,
  # Build", and "SQL Migration Validation" - with required_approving_review_count
  # 0 and CodeRabbit absent from the required list. A failing check therefore
  # shows red and refuses approval; it does not disable the merge button. Making
  # it a true gate means adding the CodeRabbit context to that ruleset, which is
  # a separate deliberate change and needs Mason's OK.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Report sections (sequence diagrams, related PRs/issues, linked-issue
  # assessment, suggested labels/reviewers, changed-files summary) are left at
  # their defaults - ON. Mason's call, 2026-08-20: he raised the usage spending
  # cap rather than trade any possible review context for a cheaper report.
  # Deliberate: do not turn these off to save spend.

  # There is deliberately NO `path_filters` block here. This config is
  # exclusion-only BY DESIGN, and right now the exclusion list is empty.
  #
  # DO NOT add a positive (non-`!`) pattern. Both CodeRabbit and the Codex
  # reviewer recommended adding `**/package-lock.json` to override CodeRabbit's
  # default lockfile ignore. Applied literally on FarmRx PR #26 (2026-08-20)
  # that advice returned "No files to review": once ANY positive pattern
  # exists, only files matching a positive pattern are reviewed, so the one
  # changed file - .coderabbit.yaml itself - was dropped. A single well-meant
  # line silently switched off code review for the whole repo, and it reads as
  # a clean pass rather than as a config error. A leading `**` restores
  # default-include breadth but ALSO opts out of CodeRabbit's curated default
  # ignore list (node_modules, build output, generated code, binaries, media,
  # source maps), which then has to be hand-maintained. FarmRx carries that
  # form because a lockfile has shipped there as the sole functional change.
  # CRX stays exclusion-only.
  #
  # Known, accepted gap: a PR changing ONLY package-lock.json is skipped by
  # CodeRabbit's own default ignore list, so version bumps and integrity
  # hashes go uninspected. That predates this config and is NOT closed here.
  #
  # The bar for adding ANY exclusion later: name the mechanism that makes those
  # files inert, and point at the check that fails if they stop being inert. A
  # directory name is never that mechanism. Four review rounds on PR #441
  # removed four doc-root exclusions (`docs/audits/`, `docs/loops/`,
  # `docs/build-loops/`, `docs/handoffs/`, then `docs/archive/`) because each
  # one turned out to hide files that automation READS AND EXECUTES - loop
  # prompts, audit prompts, handoffs, and JSON ledgers. On a public repo an
  # excluded agent-control file is a prompt-injection path into privileged
  # automation, not a cost-control question. Every document under docs/ is
  # reviewed today. The exclusion work, and the repository-walking test that
  # enforces this rule, are parked in PR #441.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    # Pause AUTOMATIC review after 2 reviewed commits on a PR (this applies to
    # ordinary non-draft PRs, not just drafts). Later pushes are then not
    # auto-reviewed until someone comments `@coderabbitai review`, which
    # resumes it. The default of 5 spent the weekly allowance on half-finished
    # commits and left nothing for the finished code: PR #429 (21 commits) and
    # PR #434 both hit "Review limit reached".
    #
    # This number is NOT the pre-merge gate and must never be treated as one.
    # The gate is reading a fresh CodeRabbit review of the FINAL commit before
    # merging - the standing policy in AGENTS.md, with the procedure in
    # .claude/skills/deploy-check/SKILL.md. That procedure is documented, not
    # yet machine-enforced; the enforcement is parked in PR #441.
    auto_pause_after_reviewed_commits: 2

  # Project-specific review guidance. These mirror the "CRX Hard Rules" in
  # AGENTS.md so CodeRabbit flags the exact mistakes that have bitten this
  # codebase before, not just generic style.
  path_instructions:
    - path: "supabase/migrations/**"
      instructions: >-
        This is a Supabase (PostgreSQL) migration for a live production app.
        Flag as high severity: any new table that does NOT enable Row Level
        Security (RLS) with policies in the same file; any SECURITY DEFINER
        function missing `SET search_path = public, pg_temp`; any mutating RPC
        that does not accept and enforce `p_idempotency_key text DEFAULT NULL`;
        any GRANT EXECUTE to anon/public on a function that writes data; any
        edit to an already-applied migration (migrations must be new files
        only). Money must be exact whole cents - never floating point. New
        money storage uses bigint cents; any new or changed money column must
        carry a finite whole-cent CHECK constraint named
        `<table>_<column>_whole_cents_chk`. A CHECK constraint that changes
        allowed status values must include all previously allowed values.
        Timestamps on the live database are UTC: flag any business-day,
        cutoff, or period-boundary logic that does not convert explicitly to
        America/Chicago.
    - path: "src/**"
      instructions: >-
        React 18 + TypeScript frontend for a live app. Flag: money handled as
        floating-point instead of integer cents; money math that does
        arithmetic on decimal strings or floats instead of parsing operands
        into integer cents FIRST; missing `assertRpcResult()` after an RPC call
        or `checkMutationResult()` after `.update()` / `.delete()`; use of
        `confirm()`, `window.confirm()`, or `alert()` instead of the shared
        ConfirmModal / toast components; writes to generated columns such as
        `invoices.balance_cents`; Supabase clients created anywhere other than
        `src/lib/db.ts`; Sentry imported from anywhere other than
        `src/lib/sentry`; any hardcoded secret, API key, or service_role key in
        frontend code. Timestamps from the database are UTC - flag business-day
        or period logic that does not convert explicitly to America/Chicago.
    # Two patterns, not one: `src/**/*[Bb]lend*` matches only the FILENAME
    # component, so it catches src/pages/BlendTickets.tsx but misses
    # src/components/blendtickets/BulkTicketUpload.tsx. The directory form
    # covers everything inside a blend-named folder. Raised by the Codex
    # reviewer on PR #441 - an earlier `git ls-files` check was a misleading
    # oracle here, because git pathspec globbing is not CodeRabbit's matcher.
    - path: "src/**/[Bb]lend*/**"
      instructions: >-
        Blend tickets are a MONEY path, not just an agronomy form: billing is
        driven by `rate_per_acre`, and a blank or missing unit still bills.
        Review any change here with the same severity as invoice or payment
        code. Flag unit handling that can silently mix measures (for example
        adding gallons to pounds), a missing or unvalidated unit that still
        reaches a billed amount, and any rate/quantity math that is not exact
        integer-cent arithmetic.
    - path: "src/**/*[Bb]lend*"
      instructions: >-
        Blend tickets are a MONEY path, not just an agronomy form: billing is
        driven by `rate_per_acre`, and a blank or missing unit still bills.
        Review any change here with the same severity as invoice or payment
        code. Flag unit handling that can silently mix measures (for example
        adding gallons to pounds), a missing or unvalidated unit that still
        reaches a billed amount, and any rate/quantity math that is not exact
        integer-cent arithmetic.
    - path: "supabase/functions/**"
      instructions: >-
        Supabase Edge Functions. Flag missing or inconsistent CORS handling,
        and any secret/service-role key that is logged or returned to the
        client.

  # Pre-merge checks turn the CRX Hard Rules from prose in AGENTS.md into
  # something a PR is measured against before it lands. Custom checks require
  # the Pro+ plan; this org is on Pro Plus (verified 2026-08-24).
  #
  # Approved by Mason 2026-08-24 after being shown that these produce a red X
  # and a withheld approval rather than a disabled merge button - see the
  # `request_changes_workflow` note above for why, and do not describe these as
  # a hard gate anywhere.
  pre_merge_checks:
    # FALSE ON PURPOSE. False lets the PR AUTHOR override a failing check by
    # ticking "Ignore failed checks" in the Walkthrough comment. Mason authors
    # every PR in this repo, so flipping this to true would lock the only human
    # here out of his own override and turn a red check into a dead end.
    override_requested_reviewers_only: false

    # Off: this repo has no docstring convention, so an 80%-coverage warning on
    # every PR is pure noise - and noise on a review budget billed per file.
    docstrings:
      mode: "off"

    title:
      mode: warning
      requirements: >-
        Title must follow Conventional Commits: `type(scope): summary`, where
        type is one of feat, fix, chore, docs, test, refactor, perf, or build.
        The summary must describe what the change does, not which review round
        or PR iteration it came from.

    # Warning rather than error: a PR body that no longer matches its diff has
    # bitten this repo before, but blocking a real fix over prose is worse.
    description:
      mode: warning

    issue_assessment:
      mode: warning

    # ---- error mode: red X + withheld approval -----------------------------
    # Every instruction below opens with an explicit skip clause, so a PR that
    # touches none of the named files passes trivially. That is deliberate: a
    # check that fires on unrelated docs and hook work gets ignored, and an
    # ignored check protects nothing.
    custom_checks:
      - name: New table without RLS
        mode: error
        instructions: >-
          Scope: only files ADDED under supabase/migrations/. If this pull
          request adds no new file under supabase/migrations/, PASS immediately
          and state that the check did not apply.

          FAIL if any added migration contains a CREATE TABLE for a table in the
          public schema without BOTH of the following in the SAME file: (1)
          ALTER TABLE ... ENABLE ROW LEVEL SECURITY for that table, and (2) at
          least one CREATE POLICY targeting that table. Partitions and temporary
          tables are exempt. Otherwise PASS.

      - name: SECURITY DEFINER without search_path
        mode: error
        instructions: >-
          Scope: only files ADDED under supabase/migrations/. If this pull
          request adds no new file under supabase/migrations/, PASS immediately
          and state that the check did not apply.

          FAIL if any added migration defines a SECURITY DEFINER function that
          does not also carry an explicit SET search_path. The expected form is
          `SET search_path = public, pg_temp`. An empty or restricted search
          path is permitted ONLY when the function body is fully schema-qualified
          on every reference; if the diff alone does not let you confirm that,
          FAIL and say which reference you could not confirm. Otherwise PASS.

      - name: Mutating RPC without idempotency key
        mode: error
        instructions: >-
          Scope: only files ADDED under supabase/migrations/. If this pull
          request adds no new file under supabase/migrations/, PASS immediately
          and state that the check did not apply.

          FAIL if any added migration creates or replaces a function that
          performs INSERT, UPDATE, DELETE, or MERGE and does not both (1) accept
          a parameter `p_idempotency_key text DEFAULT NULL` and (2) actually use
          that parameter to short-circuit or de-duplicate a repeated call. A
          parameter that is accepted and then ignored is a FAIL, not a pass -
          the signature alone proves nothing. Read-only functions are exempt.
          Otherwise PASS.

      - name: Money not exact whole cents
        mode: error
        instructions: >-
          Scope: files under supabase/migrations/ and src/. If this pull request
          changes no file in either location, PASS immediately.

          FAIL on any of the following. (1) A new or changed money column that is
          not bigint cents, unless it is PostgreSQL numeric AND carries an active
          finite whole-cent CHECK constraint named
          `<table>_<column>_whole_cents_chk`. (2) Money arithmetic in TypeScript
          performed on floats, or on decimal strings, without first parsing the
          operands into integer cents. (3) Any write to a generated column such
          as invoices.balance_cents. (4) Money rounding done in binary floating
          point. Otherwise PASS.

      - name: Edit to an already-applied migration
        mode: error
        instructions: >-
          Scope: only supabase/migrations/. If this pull request modifies no
          existing file there, PASS immediately.

          FAIL if the diff MODIFIES or DELETES any pre-existing file under
          supabase/migrations/. Database changes ship as brand-new migration
          files only; rewriting a migration that already ran leaves the live
          database and the repository permanently out of sync. ADDING a new file
          there is correct and is never a failure. Otherwise PASS.

# Teach CodeRabbit this repo's own written rules so it reviews against the
# actual house standard instead of only the path instructions above.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/reference/gotchas.md"
      - "docs/workflows/**.md"

chat:
  auto_reply: true
